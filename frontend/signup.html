<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account · StudySphere</title>
  <meta name="description" content="StudySphere - the all-in-one academic productivity platform for college students." />

  <!-- Bootstrap 5 + Remix Icons (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" />
  <!-- Our styles: design system first, page extras second -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <!-- Applies the saved dark/light theme before the page paints -->
  <script src="js/theme.js"></script>
</head>
<body data-page="signup">
  <div class="orb orb-1"></div><div class="orb orb-2"></div>
  <main class="auth-page">
    <section class="auth-card glass-card">
      <div class="auth-header">
        <a href="index.html" class="logo-mark" style="font-size:1.6rem;display:inline-block;margin-bottom:8px">Study<span>Sphere</span></a>
        <h1 style="font-size:1.8rem">Create account</h1>
        <p>Start your free academic journey today</p>
      </div>

      <!-- Social login (UI placeholders) -->
      <div class="social-login">
        <button type="button" class="social-btn" data-social="Google"><i class="ri-google-fill" style="color:#EA4335;font-size:1.1rem"></i> Google</button>
        <button type="button" class="social-btn" data-social="GitHub"><i class="ri-github-fill" style="font-size:1.1rem"></i> GitHub</button>
      </div>
      <div class="divider"><div class="divider-line"></div><span>or continue with email</span><div class="divider-line"></div></div>

      <form id="authForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="name">Full name</label>
          <div class="input-icon-wrap"><i class="ri-user-line" aria-hidden="true"></i>
            <input class="form-input" id="name" name="name" type="text" placeholder="Alex Johnson" autocomplete="name" required value="" /></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">University email</label>
          <div class="input-icon-wrap"><i class="ri-mail-line" aria-hidden="true"></i>
            <input class="form-input" id="email" name="email" type="email" placeholder="you@university.edu" autocomplete="email" required value="" /></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="college">College / course</label>
          <div class="input-icon-wrap"><i class="ri-graduation-cap-line" aria-hidden="true"></i>
            <input class="form-input" id="college" name="college" type="text" placeholder="e.g. B.Tech CSE · Year 2" autocomplete="organization" value="" /></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password (min 6 characters)</label>
          <div class="input-icon-wrap"><i class="ri-lock-2-line" aria-hidden="true"></i>
            <input class="form-input" id="password" name="password" type="password" placeholder="Create a password" autocomplete="new-password" required minlength="6" value="" /><button type="button" class="pw-toggle" data-toggle-pw aria-label="Show or hide password"><i class="ri-eye-line"></i></button></div>
        </div>
        <div class="form-error" id="formError" role="alert"></div>
        <button type="submit" class="btn-primary-glass" id="authBtn" style="width:100%"><i class="ri-user-add-line"></i> Create free account</button>
      </form>

      <p style="text-align:center;margin-top:20px;font-size:.88rem">Already have an account? <a href="login.html" style="color:var(--primary-light);font-weight:600">Sign in</a></p>
      <p style="text-align:center;margin-top:8px"><a href="index.html" style="font-size:.82rem;color:var(--text-muted)">← Back to home page</a></p>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
