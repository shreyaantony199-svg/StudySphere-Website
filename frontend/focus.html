<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Mode · StudySphere</title>
  <meta name="description" content="StudySphere - the all-in-one academic productivity platform for college students." />

  <!-- Bootstrap 5 + Remix Icons (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" />
  <!-- Our styles: design system first, page extras second -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <!-- Applies the saved dark/light theme before the page paints -->
  <script src="js/theme.js"></script>
</head>
<body data-page="focus">
  <a class="skip-link" href="#page-content">Skip to main content</a>

  <!-- Page content. layout.js wraps this with the sidebar + top bar -->
  <main id="page-content" class="page active">
    <div class="focus-container">
      <div class="focus-top" role="group" aria-label="Timer mode">
        <button class="pom-mode-btn active" data-mins="25" data-mode="focus">🎯 Focus 25m</button>
        <button class="pom-mode-btn" data-mins="5" data-mode="break">☕ Short break 5m</button>
        <button class="pom-mode-btn" data-mins="15" data-mode="break">🛋️ Long break 15m</button>
      </div>

      <div class="focus-task">
        <label class="form-label" for="focusTask">I'm working on</label>
        <select class="form-input" id="focusTask"><option>Anything</option></select>
      </div>

      <div class="pomodoro-ring" role="timer" aria-live="off">
        <svg viewBox="0 0 260 260" width="260" height="260">
          <defs><linearGradient id="pomGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6C63FF"/><stop offset="100%" stop-color="#00D9FF"/></linearGradient></defs>
          <circle class="pr-track" cx="130" cy="130" r="115"/><circle class="pr-fill" id="pomCircle" cx="130" cy="130" r="115"/>
        </svg>
        <div class="pomodoro-center"><div class="pom-time" id="pomTime">25:00</div><div class="pom-label" id="pomLabel">Focus time</div></div>
      </div>

      <div class="session-dots" id="sessionDots" aria-label="Sessions completed in this cycle"></div>

      <div class="pom-controls">
        <button class="pom-btn" id="pomReset" aria-label="Reset timer"><i class="ri-refresh-line"></i></button>
        <button class="pom-btn primary-pom" id="pomPlay" aria-label="Start or pause timer"><i class="ri-play-fill"></i></button>
        <button class="pom-btn" id="pomSkip" aria-label="Skip to the next phase"><i class="ri-skip-forward-line"></i></button>
      </div>

      <!-- Study session tracker -->
      <section class="tracker-card glass-card" aria-labelledby="trkTitle">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h3 id="trkTitle" style="font-size:1rem">📈 Today's sessions</h3>
          <span class="badge-primary" id="trkSummary">0 sessions · 0 min</span>
        </div>
        <div id="sessionLog"></div>
      </section>

      <!-- Ambient sounds (generated in the browser with the Web Audio API) -->
      <div style="text-align:center;width:100%;margin-bottom:20px">
        <div style="font-size:.78rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:14px">🎵 Ambient sounds</div>
        <div class="ambient-grid" style="margin:0 auto">
          <button class="ambient-btn" data-sound="rain"><i class="ri-rainy-line"></i>Rain</button>
          <button class="ambient-btn" data-sound="forest"><i class="ri-leaf-line"></i>Forest</button>
          <button class="ambient-btn" data-sound="cafe"><i class="ri-cup-line"></i>Café</button>
          <button class="ambient-btn" data-sound="lofi"><i class="ri-music-2-line"></i>Lo-Fi</button>
        </div>
        <div class="vol-wrap"><i class="ri-volume-down-line"></i><input type="range" id="volume" min="0" max="100" value="40" aria-label="Ambient volume" /><i class="ri-volume-up-line"></i></div>
      </div>

      <button class="btn-ghost" id="zenBtn"><i class="ri-fullscreen-line"></i> Distraction-free mode</button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/focus.js"></script>
</body>
</html>
