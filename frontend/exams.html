<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exam Countdown · StudySphere</title>
  <meta name="description" content="StudySphere - the all-in-one academic productivity platform for college students." />

  <!-- Bootstrap 5 + Remix Icons (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" />
  <!-- Our styles: design system first, page extras second -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <!-- Applies the saved dark/light theme before the page paints -->
  <script src="js/theme.js"></script>
</head>
<body data-page="exams">
  <a class="skip-link" href="#page-content">Skip to main content</a>

  <!-- Page content. layout.js wraps this with the sidebar + top bar -->
  <main id="page-content" class="page active">
    <div class="page-header">
      <div><h2>⏳ Exam Countdown Center</h2><p>Live countdowns and preparation status for every exam</p></div>
      <button class="btn-primary-glass" id="addExamBtn"><i class="ri-add-line"></i> Add Exam</button>
    </div>

    <section class="exam-hero glass-card" id="examHero" aria-live="off"></section>
    <div class="exams-grid" id="examGrid"></div>
  </main>

  <!-- ============ Modals ============ -->
  <div class="modal-overlay" id="examModal" role="dialog" aria-modal="true" aria-labelledby="examModalTitle">
    <form class="modal-box" id="examModalForm" novalidate>
      <div class="ss-modal-header">
        <h2 class="ss-modal-title" id="examModalTitle">Add Exam</h2>
        <button type="button" class="ss-modal-close" data-close aria-label="Close dialog">✕</button>
      </div>
      <input type="hidden" name="id" />
      <div class="row g-3"><div class="form-group col-sm-7"><label class="form-label" for="examModal-subject">Subject *</label><input class="form-input" id="examModal-subject" name="subject" type="text" required maxlength="40" placeholder="Data Structures" /></div><div class="form-group col-sm-5"><label class="form-label" for="examModal-code">Code</label><input class="form-input" id="examModal-code" name="code" type="text" maxlength="12" placeholder="CS301" /></div></div><div class="row g-3"><div class="form-group col-sm-6"><label class="form-label" for="examModal-date">Exam date *</label><input class="form-input" id="examModal-date" name="date" type="date" required /></div><div class="form-group col-sm-6"><label class="form-label" for="examModal-room">Hall / room</label><input class="form-input" id="examModal-room" name="room" type="text" maxlength="30" /></div></div><div class="row g-3"><div class="form-group col-sm-6"><label class="form-label" for="examModal-prep">Preparation: <output id="examModal-prep-out">0%</output></label><input type="range" id="examModal-prep" name="prep" min="0" max="100" step="5" value="0" /></div></div>
      <div class="d-flex gap-2 mt-2">
        <button type="submit" class="btn-primary-glass flex-fill">Save</button>
        
        <button type="button" class="btn-ghost" data-close>Cancel</button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/exams.js"></script>
</body>
</html>
