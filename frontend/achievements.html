<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Achievements · StudySphere</title>
  <meta name="description" content="StudySphere - the all-in-one academic productivity platform for college students." />

  <!-- Bootstrap 5 + Remix Icons (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" />
  <!-- Our styles: design system first, page extras second -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <!-- Applies the saved dark/light theme before the page paints -->
  <script src="js/theme.js"></script>
</head>
<body data-page="achievements">
  <a class="skip-link" href="#page-content">Skip to main content</a>

  <!-- Page content. layout.js wraps this with the sidebar + top bar -->
  <main id="page-content" class="page active">
    <div class="page-header">
      <div><h2>🏆 Achievement Center</h2><p>Earn badges, keep your streak alive and level up</p></div>
    </div>

    <section class="level-card glass-card" id="levelCard"></section>

    <section class="glass-card streak-card" style="margin-bottom:28px">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">
        <div><h3 style="font-size:1.05rem" id="streakTitle">🔥 Study streak</h3><p style="font-size:.83rem">Study at least a little every day to keep it going. Last 14 days:</p></div>
        <div id="streakBig" style="font-family:var(--font-display);font-size:2rem;font-weight:800;background:var(--grad-warm);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">0 🔥</div>
      </div>
      <div class="streak-bar" id="streakBar"></div>
    </section>

    <h3 style="font-size:1.05rem;margin-bottom:16px">Badge collection</h3>
    <div class="achievements-grid" id="badgeGrid"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/achievements.js"></script>
</body>
</html>
