<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignments · StudySphere</title>
  <meta name="description" content="StudySphere - the all-in-one academic productivity platform for college students." />

  <!-- Bootstrap 5 + Remix Icons (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" />
  <!-- Our styles: design system first, page extras second -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <!-- Applies the saved dark/light theme before the page paints -->
  <script src="js/theme.js"></script>
</head>
<body data-page="assignments">
  <a class="skip-link" href="#page-content">Skip to main content</a>

  <!-- Page content. layout.js wraps this with the sidebar + top bar -->
  <main id="page-content" class="page active">
    <div class="page-header">
      <div><h2>📝 Assignment Tracker</h2><p>Deadlines, progress and submission status in one place</p></div>
      <button class="btn-primary-glass" id="addAssignmentBtn"><i class="ri-add-line"></i> New Assignment</button>
    </div>

    <div class="d-flex flex-wrap gap-3 align-items-center mb-3">
      <div class="asgn-search">
        <i class="ri-search-line" style="color:var(--text-muted)" aria-hidden="true"></i>
        <input type="search" id="asgnSearch" placeholder="Search by title or subject…" aria-label="Search assignments" />
      </div>
      <select class="form-input sort-select" id="asgnSort" aria-label="Sort assignments">
        <option value="due">Sort: due date</option>
        <option value="progress">Sort: progress</option>
        <option value="subject">Sort: subject</option>
      </select>
    </div>
    <div class="todo-controls" id="asgnPills" role="group" aria-label="Filter by status">
      <button class="filter-pill active" data-filter="all">All</button>
      <button class="filter-pill" data-filter="pending">Pending</button>
      <button class="filter-pill" data-filter="in-progress">In progress</button>
      <button class="filter-pill" data-filter="submitted">Submitted</button>
      <button class="filter-pill" data-filter="overdue">Overdue</button>
    </div>

    <div class="assignments-grid" id="asgnGrid" aria-live="polite"></div>
  </main>

  <!-- ============ Modals ============ -->
  <div class="modal-overlay" id="asgnModal" role="dialog" aria-modal="true" aria-labelledby="asgnModalTitle">
    <form class="modal-box" id="asgnModalForm" novalidate>
      <div class="ss-modal-header">
        <h2 class="ss-modal-title" id="asgnModalTitle">New Assignment</h2>
        <button type="button" class="ss-modal-close" data-close aria-label="Close dialog">✕</button>
      </div>
      <input type="hidden" name="id" />
      <div class="form-group "><label class="form-label" for="asgnModal-title">Title *</label><input class="form-input" id="asgnModal-title" name="title" type="text" required maxlength="120" placeholder="e.g. Database ER Diagram" /></div><div class="row g-3"><div class="form-group col-sm-6"><label class="form-label" for="asgnModal-subject">Subject code *</label><input class="form-input" id="asgnModal-subject" name="subject" type="text" required maxlength="12" placeholder="CS301" /></div><div class="form-group col-sm-6"><label class="form-label" for="asgnModal-due">Due date *</label><input class="form-input" id="asgnModal-due" name="due" type="date" required /></div></div><div class="form-group"><label class="form-label" for="asgnModal-description">Description</label><textarea class="form-input" id="asgnModal-description" name="description" maxlength="300" style="min-height:90px"></textarea></div><div class="row g-3"><div class="form-group col-sm-6"><label class="form-label" for="asgnModal-status">Status</label><select class="form-input" id="asgnModal-status" name="status"><option value="pending">Pending</option><option value="in-progress">In progress</option><option value="submitted">Submitted</option></select></div><div class="form-group col-sm-6"><label class="form-label" for="asgnModal-progress">Progress: <output id="asgnModal-progress-out">0%</output></label><input type="range" id="asgnModal-progress" name="progress" min="0" max="100" step="5" value="0" /></div></div>
      <div class="d-flex gap-2 mt-2">
        <button type="submit" class="btn-primary-glass flex-fill">Save</button>
        <button type="button" class="btn-ghost" data-delete style="color:#FF5252">Delete</button>
        <button type="button" class="btn-ghost" data-close>Cancel</button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/assignments.js"></script>
</body>
</html>
