<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do Manager · StudySphere</title>
  <meta name="description" content="StudySphere - the all-in-one academic productivity platform for college students." />

  <!-- Bootstrap 5 + Remix Icons (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" />
  <!-- Our styles: design system first, page extras second -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <!-- Applies the saved dark/light theme before the page paints -->
  <script src="js/theme.js"></script>
</head>
<body data-page="todos">
  <a class="skip-link" href="#page-content">Skip to main content</a>

  <!-- Page content. layout.js wraps this with the sidebar + top bar -->
  <main id="page-content" class="page active">
    <div class="page-header">
      <div><h2>✅ To-Do Manager</h2><p>Organise your tasks, set priorities and track progress</p></div>
      <button class="btn-primary-glass" id="addTaskBtn"><i class="ri-add-line"></i> Add Task</button>
    </div>

    <div class="stats-grid compact">
      <div class="stat-card glass-card"><div class="stat-value sv-purple" id="sTotal">0</div><div class="stat-label">Total tasks</div></div>
      <div class="stat-card glass-card"><div class="stat-value sv-cyan" id="sDone">0</div><div class="stat-label">Completed</div></div>
      <div class="stat-card glass-card"><div class="stat-value sv-pink" id="sHigh">0</div><div class="stat-label">High priority open</div></div>
      <div class="stat-card glass-card"><div class="stat-value sv-gold" id="sPct">0%</div><div class="stat-label">Completion rate</div></div>
    </div>

    <div class="todo-controls" id="statusPills" role="group" aria-label="Filter by status">
      <button class="filter-pill active" data-filter="all">All</button>
      <button class="filter-pill" data-filter="active">Active</button>
      <button class="filter-pill" data-filter="high">High priority</button>
      <button class="filter-pill" data-filter="done">Completed</button>
    </div>
    <div class="todo-controls" id="categoryPills" role="group" aria-label="Filter by category"></div>

    <div class="todo-list" id="todoList" aria-live="polite"></div>
  </main>

  <!-- ============ Modals ============ -->
  <div class="modal-overlay" id="taskModal" role="dialog" aria-modal="true" aria-labelledby="taskModalTitle">
    <form class="modal-box" id="taskModalForm" novalidate>
      <div class="ss-modal-header">
        <h2 class="ss-modal-title" id="taskModalTitle">Add Task</h2>
        <button type="button" class="ss-modal-close" data-close aria-label="Close dialog">✕</button>
      </div>
      <input type="hidden" name="id" />
      <div class="form-group "><label class="form-label" for="taskModal-title">Task title *</label><input class="form-input" id="taskModal-title" name="title" type="text" required maxlength="120" placeholder="e.g. Finish assignment draft" /></div><div class="row g-3"><div class="form-group col-sm-6"><label class="form-label" for="taskModal-category">Subject / category</label><input class="form-input" id="taskModal-category" name="category" type="text" list="catList" placeholder="e.g. CS301" maxlength="30" /></div><datalist id="catList"></datalist><div class="form-group col-sm-6"><label class="form-label" for="taskModal-priority">Priority</label><select class="form-input" id="taskModal-priority" name="priority"><option value="high">🔴 High</option><option value="medium">🟡 Medium</option><option value="low">🟢 Low</option></select></div></div><div class="row g-3"><div class="form-group col-sm-6"><label class="form-label" for="taskModal-due">Due date</label><input class="form-input" id="taskModal-due" name="due" type="date"  /></div><div class="form-group col-sm-6"><label class="form-label" for="taskModal-progress">Progress: <output id="taskModal-progress-out">0%</output></label><input type="range" id="taskModal-progress" name="progress" min="0" max="100" step="5" value="0" /></div></div>
      <div class="d-flex gap-2 mt-2">
        <button type="submit" class="btn-primary-glass flex-fill">Save</button>
        
        <button type="button" class="btn-ghost" data-close>Cancel</button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/todos.js"></script>
</body>
</html>
