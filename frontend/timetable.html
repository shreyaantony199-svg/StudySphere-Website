<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timetable · StudySphere</title>
  <meta name="description" content="StudySphere - the all-in-one academic productivity platform for college students." />

  <!-- Bootstrap 5 + Remix Icons (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" />
  <!-- Our styles: design system first, page extras second -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <!-- Applies the saved dark/light theme before the page paints -->
  <script src="js/theme.js"></script>
</head>
<body data-page="timetable">
  <a class="skip-link" href="#page-content">Skip to main content</a>

  <!-- Page content. layout.js wraps this with the sidebar + top bar -->
  <main id="page-content" class="page active">
    <div class="page-header">
      <div><h2>📅 Weekly Timetable</h2><p>Drag a class to a new slot, or click any empty slot to add one</p></div>
      <button class="btn-primary-glass" id="addClassBtn"><i class="ri-add-line"></i> Add Class</button>
    </div>

    <h3 style="font-size:1rem;margin-bottom:12px">🔔 Class reminders for today</h3>
    <div class="reminder-grid" id="reminders"></div>

    <div class="glass-card" style="padding:20px;overflow-x:auto">
      <div class="week-grid" id="weekGrid" style="min-width:720px" role="grid" aria-label="Weekly timetable"></div>
    </div>
    <div class="legend" id="legend"></div>
  </main>

  <!-- ============ Modals ============ -->
  <div class="modal-overlay" id="classModal" role="dialog" aria-modal="true" aria-labelledby="classModalTitle">
    <form class="modal-box" id="classModalForm" novalidate>
      <div class="ss-modal-header">
        <h2 class="ss-modal-title" id="classModalTitle">Add Class</h2>
        <button type="button" class="ss-modal-close" data-close aria-label="Close dialog">✕</button>
      </div>
      <input type="hidden" name="id" />
      <div class="row g-3"><div class="form-group col-sm-5"><label class="form-label" for="classModal-code">Course code *</label><input class="form-input" id="classModal-code" name="code" type="text" required maxlength="12" placeholder="CS301" /></div><div class="form-group col-sm-7"><label class="form-label" for="classModal-subject">Subject name *</label><input class="form-input" id="classModal-subject" name="subject" type="text" required maxlength="40" placeholder="Data Structures" /></div></div><div class="form-group "><label class="form-label" for="classModal-room">Room / venue</label><input class="form-input" id="classModal-room" name="room" type="text" maxlength="30" placeholder="Rm 301" /></div><div class="row g-3"><div class="form-group col-sm-6"><label class="form-label" for="classModal-day">Day</label><select class="form-input" id="classModal-day" name="day"><option value="0">Monday</option><option value="1">Tuesday</option><option value="2">Wednesday</option><option value="3">Thursday</option><option value="4">Friday</option><option value="5">Saturday</option><option value="6">Sunday</option></select></div><div class="form-group col-sm-6"><label class="form-label" for="classModal-start">Start time</label><select class="form-input" id="classModal-start" name="start"><option value="8">8:00 AM</option><option value="9">9:00 AM</option><option value="10">10:00 AM</option><option value="11">11:00 AM</option><option value="12">12:00 PM</option><option value="13">1:00 PM</option><option value="14">2:00 PM</option><option value="15">3:00 PM</option><option value="16">4:00 PM</option><option value="17">5:00 PM</option><option value="18">6:00 PM</option></select></div></div>
      <div class="d-flex gap-2 mt-2">
        <button type="submit" class="btn-primary-glass flex-fill">Save</button>
        <button type="button" class="btn-ghost" data-delete style="color:#FF5252">Delete</button>
        <button type="button" class="btn-ghost" data-close>Cancel</button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/timetable.js"></script>
</body>
</html>
