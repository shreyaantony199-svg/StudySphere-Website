<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes Vault · StudySphere</title>
  <meta name="description" content="StudySphere - the all-in-one academic productivity platform for college students." />

  <!-- Bootstrap 5 + Remix Icons (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" />
  <!-- Our styles: design system first, page extras second -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <!-- Applies the saved dark/light theme before the page paints -->
  <script src="js/theme.js"></script>
</head>
<body data-page="notes">
  <a class="skip-link" href="#page-content">Skip to main content</a>

  <!-- Page content. layout.js wraps this with the sidebar + top bar -->
  <main id="page-content" class="page active">
    <div class="page-header">
      <div><h2>📓 Notes Vault</h2><p>Your searchable, organised knowledge base</p></div>
      <button class="btn-primary-glass" id="addNoteBtn"><i class="ri-add-line"></i> New Note</button>
    </div>

    <div class="d-flex flex-wrap gap-3 align-items-center mb-3">
      <div class="notes-search" style="flex:1;min-width:240px">
        <i class="ri-search-line" style="color:var(--text-muted)" aria-hidden="true"></i>
        <input type="search" id="noteSearch" placeholder="Search notes by title or content…" aria-label="Search notes" />
      </div>
    </div>
    <div class="todo-controls" id="notePills" role="group" aria-label="Filter notes by subject"></div>

    <div id="noteFavSection"><div class="section-label">⭐ Favourites</div><div class="notes-grid mb-4" id="noteFavGrid"></div></div>
    <div class="section-label" id="noteAllLabel">All notes</div>
    <div class="notes-grid" id="noteGrid"></div>
  </main>

  <!-- ============ Modals ============ -->
  <div class="modal-overlay" id="noteModal" role="dialog" aria-modal="true" aria-labelledby="noteModalTitle">
    <form class="modal-box" id="noteModalForm" novalidate>
      <div class="ss-modal-header">
        <h2 class="ss-modal-title" id="noteModalTitle">New Note</h2>
        <button type="button" class="ss-modal-close" data-close aria-label="Close dialog">✕</button>
      </div>
      <input type="hidden" name="id" />
      <div class="row g-3"><div class="form-group col-sm-8"><label class="form-label" for="noteModal-title">Title *</label><input class="form-input" id="noteModal-title" name="title" type="text" required maxlength="100" /></div><div class="form-group col-sm-4"><label class="form-label" for="noteModal-subject">Subject</label><input class="form-input" id="noteModal-subject" name="subject" type="text" list="noteSubjects" maxlength="20" placeholder="CS301" /></div><datalist id="noteSubjects"></datalist></div><div class="form-group"><label class="form-label" for="noteModal-content">Note</label><textarea class="form-input" id="noteModal-content" name="content" maxlength="3000" placeholder="Write your note here…"></textarea></div>
      <div class="d-flex gap-2 mt-2">
        <button type="submit" class="btn-primary-glass flex-fill">Save</button>
        <button type="button" class="btn-ghost" data-delete style="color:#FF5252">Delete</button>
        <button type="button" class="btn-ghost" data-close>Cancel</button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/notes.js"></script>
</body>
</html>
